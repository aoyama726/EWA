<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>My English Words</title>

<style>
:root{
  --bg:#f5f7fb;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --primary:#111827;
  --blue:#2563eb;
  --red:#dc2626;
  --green:#15803d;
  --soft:#eef2ff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(245,247,251,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:18px 16px;
}

header h1{
  margin:0;
  font-size:22px;
}

main{
  max-width:760px;
  margin:auto;
  padding:16px 16px 100px;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:18px;
}

button{
  border:0;
  border-radius:14px;
  padding:13px 14px;
  font-size:16px;
  font-weight:750;
  background:#e5e7eb;
  color:#111827;
}

button:disabled{
  opacity:.55;
}

.tab{
  min-height:60px;
  font-size:18px;
}

.tab.active,
button.primary{
  background:var(--primary);
  color:white;
}

button.blue{
  background:var(--blue);
  color:white;
}

button.danger{
  background:#fee2e2;
  color:var(--red);
}

button.correct{
  background:#dcfce7;
  color:var(--green);
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.03);
}

.section-title{
  font-size:22px;
  font-weight:850;
  margin-bottom:6px;
}

label{
  display:block;
  font-weight:800;
  font-size:15px;
  margin:18px 0 8px;
}

input,
textarea,
select{
  width:100%;
  padding:13px 14px;
  border:1px solid #d1d5db;
  border-radius:13px;
  background:white;
  color:#111827;
  font-size:17px;
  font-family:inherit;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.searchBox{
  position:relative;
  margin-top:14px;
}

.searchBox input{
  padding-left:44px;
}

.searchIcon{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  font-size:19px;
  pointer-events:none;
}

.row{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.space{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.word{
  font-size:29px;
  font-weight:850;
  word-break:break-word;
}

.meaning{
  font-size:18px;
  margin-top:6px;
  white-space:pre-wrap;
}

.small{
  font-size:16px;
  line-height:1.65;
  white-space:pre-wrap;
}

.muted{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

.hidden{
  display:none!important;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:16px;
}

.stat{
  background:#f9fafb;
  border-radius:14px;
  padding:14px 8px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:21px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:40px 12px;
  font-size:17px;
}

.quizPrompt{
  font-size:32px;
  font-weight:850;
  text-align:center;
  margin:26px 0;
  white-space:pre-wrap;
  word-break:break-word;
}

.choices{
  display:grid;
  gap:12px;
  margin-top:18px;
}

.choice{
  width:100%;
  min-height:64px;
  background:#f3f4f6;
  border:2px solid transparent;
  text-align:left;
  padding:16px;
  font-size:18px;
}

.choice.selectedCorrect{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
}

.choice.selectedWrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#991b1b;
}

.choice.showCorrect{
  background:#dcfce7;
  border-color:#22c55e;
}

.feedback{
  margin-top:18px;
  padding:16px;
  border-radius:16px;
}

.feedback.good{
  background:#ecfdf5;
}

.feedback.bad{
  background:#fef2f2;
}

.feedbackTitle{
  font-size:22px;
  font-weight:850;
}

.divider{
  height:1px;
  background:var(--line);
  margin:16px 0;
}

.audio-buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px;
}

#nextQuestion{
  width:100%;
  margin-top:16px;
}


/* =========================
   AI 写真追加
========================= */

.ai-box{
  border:2px dashed #cbd5e1;
  background:#f8fafc;
}

.ai-preview{
  width:100%;
  max-height:340px;
  object-fit:contain;
  border-radius:14px;
  margin-top:12px;
  border:1px solid var(--line);
  background:white;
}

.ai-result{
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin-top:12px;
  background:white;
}

.ai-result-head{
  display:flex;
  gap:12px;
  align-items:flex-start;
}

.ai-result-head input{
  width:auto;
  margin-top:6px;
  transform:scale(1.25);
}

.ai-result-word{
  font-size:22px;
  font-weight:850;
}

.ai-result-meta{
  color:var(--muted);
  font-size:14px;
  margin-top:4px;
}

.ai-result-field{
  margin-top:13px;
}

.ai-result-field strong{
  display:block;
  font-size:14px;
  margin-bottom:4px;
}

.ai-result-field div{
  white-space:pre-wrap;
  line-height:1.55;
}

.ai-memo-preview{
  margin-top:13px;
  padding:12px;
  background:#f9fafb;
  border-radius:12px;
  white-space:pre-wrap;
  font-size:14px;
  line-height:1.6;
  max-height:260px;
  overflow:auto;
}

.status{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#f3f4f6;
  white-space:pre-wrap;
  line-height:1.5;
}

.status.ok{
  background:#ecfdf5;
  color:#166534;
}

.status.err{
  background:#fef2f2;
  color:#991b1b;
}

@media(max-width:560px){
  .grid2{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>My English Words</h1>
</header>

<main>

<div class="tabs">

  <button
    class="tab active"
    data-tab="words"
  >
    単語帳
  </button>

  <button
    class="tab"
    data-tab="add"
  >
    追加
  </button>

  <button
    class="tab"
    data-tab="quiz"
  >
    テスト
  </button>

  <button
    class="tab"
    data-tab="backup"
  >
    バックアップ
  </button>

</div>


<!-- =========================
     単語帳
========================= -->

<section id="wordsSection">

  <div class="card">

    <div class="space">

      <div>

        <div class="section-title">
          登録単語
        </div>

        <div class="muted">
          <span id="wordCount">0</span>
          words
        </div>

      </div>


      <select
        id="filterMode"
        style="width:auto"
      >

        <option value="all">
          すべて
        </option>

        <option value="wrong">
          間違えた単語
        </option>

        <option value="weak">
          苦手順
        </option>

      </select>

    </div>


    <div class="searchBox">

      <span class="searchIcon">
        🔍
      </span>

      <input
        id="searchInput"
        type="search"
        autocomplete="off"
        placeholder="単語・意味・例文・メモを検索"
      >

    </div>

    <div
      class="muted"
      id="searchResult"
      style="margin-top:10px"
    ></div>

  </div>


  <div id="wordList"></div>

</section>


<!-- =========================
     追加
========================= -->

<section
  id="addSection"
  class="hidden"
>


  <!-- AI写真追加 -->

  <div class="card ai-box">

    <div class="section-title">
      📷 写真からAI追加
    </div>

    <div class="muted">
      教材や単語帳の写真を撮ると、
      AIが単語・例文・意味・品詞・詳しい説明を作成します。
    </div>


    <label>
      写真を撮る / 選ぶ
    </label>

    <input
      id="aiImage"
      type="file"
      accept="image/*"
      capture="environment"
    >


    <img
      id="aiPreview"
      class="ai-preview hidden"
      alt="選択した写真"
    >


    <button
      class="blue"
      id="analyzeImage"
      style="width:100%;margin-top:14px"
    >
      ✨ AIで解析する
    </button>


    <div
      id="aiStatus"
      class="status hidden"
    ></div>


    <div id="aiResults"></div>


    <button
      class="primary hidden"
      id="addAiWords"
      style="width:100%;margin-top:16px"
    >
      選択した単語を追加
    </button>

  </div>


  <!-- 手動追加 -->

  <div class="card">

    <div
      class="section-title"
      id="formTitle"
    >
      単語を追加
    </div>

    <div class="muted">
      単語と意味だけ必須です。
    </div>


    <input
      type="hidden"
      id="editId"
    >


    <label>
      英単語・フレーズ
    </label>

    <input
      id="word"
      autocapitalize="none"
      autocomplete="off"
      placeholder="例: ensure"
    >


    <label>
      例文
    </label>

    <textarea
      id="example"
      placeholder="例文"
    ></textarea>


    <label>
      意味
    </label>

    <textarea
      id="meaning"
      placeholder="単語の意味"
    ></textarea>


    <label>
      例文の日本語訳
    </label>

    <textarea
      id="translation"
      placeholder="例文の日本語訳"
    ></textarea>


    <label>
      使い方メモ
    </label>

    <textarea
      id="usage"
      placeholder="例: verb"
    ></textarea>


    <label>
      自由メモ
    </label>

    <textarea
      id="memo"
      placeholder="詳しい説明・よく使う形・追加例文・似た単語との違い"
    ></textarea>


    <div
      class="row"
      style="margin-top:18px"
    >

      <button
        class="primary"
        id="saveBtn"
      >
        保存
      </button>

      <button
        id="cancelEdit"
        class="hidden"
      >
        キャンセル
      </button>

    </div>

  </div>

</section>


<!-- =========================
     テスト
========================= -->

<section
  id="quizSection"
  class="hidden"
>

  <div class="card">

    <div class="section-title">
      テスト
    </div>


    <div class="grid2">

      <div>

        <label>
          テスト形式
        </label>

        <select id="quizMode">

          <option value="en-ja">
            英語 → 日本語
          </option>

          <option value="ja-en">
            日本語 → 英語
          </option>

          <option value="audio">
            音声 → 日本語
          </option>

        </select>

      </div>


      <div>

        <label>
          出題範囲
        </label>

        <select id="quizScope">

          <option value="all">
            すべて
          </option>

          <option value="wrong">
            間違えた単語のみ
          </option>

          <option value="weak">
            苦手優先
          </option>

        </select>

      </div>

    </div>


    <button
      class="primary"
      id="startQuiz"
      style="width:100%;margin-top:18px"
    >
      テスト開始
    </button>

  </div>


  <div
    id="quizCard"
    class="card hidden"
  >

    <div
      class="muted"
      id="quizProgress"
    ></div>


    <div
      id="quizPrompt"
      class="quizPrompt"
    ></div>


    <div
      id="audioArea"
      class="row hidden"
      style="justify-content:center"
    >

      <button
        class="blue"
        id="playAudio"
      >
        ▶ 再生
      </button>

    </div>


    <div
      id="choices"
      class="choices"
    ></div>


    <div
      id="feedback"
      class="hidden"
    ></div>


    <button
      class="primary hidden"
      id="nextQuestion"
    >
      次の問題 →
    </button>

  </div>


  <div
    id="quizResult"
    class="card hidden"
  ></div>

</section>


<!-- =========================
     バックアップ
========================= -->

<section
  id="backupSection"
  class="hidden"
>

  <div class="card">

    <div class="section-title">
      バックアップ
    </div>

    <div class="muted">
      ブラウザのデータ削除や機種変更に備えて保存できます。
    </div>


    <label>
      バックアップを書き出す
    </label>

    <button
      class="primary"
      id="exportBtn"
      style="width:100%"
    >
      JSONファイルを保存
    </button>


    <div class="divider"></div>


    <label>
      バックアップを読み込む
    </label>

    <input
      type="file"
      id="importFile"
      accept=".json,application/json"
    >


    <button
      id="importBtn"
      style="width:100%;margin-top:12px"
    >
      選んだバックアップを復元
    </button>

  </div>

</section>

</main>


<script>

(() => {

"use strict";


/* =========================
   保存設定
========================= */

const STORAGE_KEY =
  "myEnglishWords_v2";


const LEGACY_KEYS = [
  "myEnglishWords",
  "myEnglishWords_v1"
];


const AI_ENDPOINT =
  "https://ewa-ai.aoyama726.workers.dev";


const $ =
  id =>
  document.getElementById(id);


let words =
  loadWords();


let quizItems = [];

let quizIndex = 0;

let quizCorrect = 0;

let quizAnswered = false;


let aiCandidates = [];

let aiObjectUrl = "";


/* =========================
   データ読み込み
========================= */

function loadWords(){

  try{

    const current =
      localStorage.getItem(
        STORAGE_KEY
      );


    if(current){

      const parsed =
        JSON.parse(
          current
        );

      if(
        Array.isArray(parsed)
      ){
        return parsed;
      }

    }


    for(
      const key
      of LEGACY_KEYS
    ){

      const old =
        localStorage.getItem(
          key
        );

      if(!old){
        continue;
      }


      const parsed =
        JSON.parse(
          old
        );


      if(
        Array.isArray(parsed)
      ){

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(
            parsed
          )
        );

        return parsed;

      }

    }

  }

  catch(error){

    console.error(
      error
    );

  }


  return [];

}


function saveWords(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(
      words
    )
  );

  renderWords();

}


/* =========================
   ID
========================= */

function uid(){

  if(
    window.crypto
    &&
    crypto.randomUUID
  ){

    return crypto.randomUUID();

  }


  return (
    Date.now()
      .toString(36)
    +
    "_"
    +
    Math.random()
      .toString(36)
      .slice(2,8)
  );

}


/* =========================
   音声
========================= */

function speak(text){

  if(!text){
    return;
  }


  if(
    !(
      "speechSynthesis"
      in window
    )
  ){

    alert(
      "音声読み上げを利用できません。"
    );

    return;

  }


  speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang =
    "en-US";

  utterance.rate =
    0.85;


  speechSynthesis.speak(
    utterance
  );

}


/* =========================
   共通
========================= */

function makeText(
  tag,
  text,
  className = ""
){

  const el =
    document.createElement(
      tag
    );


  if(className){
    el.className =
      className;
  }


  el.textContent =
    text || "";


  return el;

}


function appendLabeled(
  card,
  label,
  value
){

  if(!value){
    return;
  }


  const box =
    document.createElement(
      "div"
    );

  box.style.marginTop =
    "18px";


  const title =
    makeText(
      "strong",
      label
    );


  const text =
    makeText(
      "div",
      value,
      "small"
    );

  text.style.marginTop =
    "6px";


  box.append(
    title,
    text
  );


  card.appendChild(
    box
  );

}


/* =========================
   タブ
========================= */

function switchTab(name){

  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      button => {

        button
          .classList
          .toggle(
            "active",
            button.dataset.tab
            ===
            name
          );

      }
    );


  $("wordsSection")
    .classList
    .toggle(
      "hidden",
      name !== "words"
    );


  $("addSection")
    .classList
    .toggle(
      "hidden",
      name !== "add"
    );


  $("quizSection")
    .classList
    .toggle(
      "hidden",
      name !== "quiz"
    );


  $("backupSection")
    .classList
    .toggle(
      "hidden",
      name !== "backup"
    );


  if(
    name
    ===
    "words"
  ){

    renderWords();

  }

}


document
  .querySelectorAll(
    ".tab"
  )
  .forEach(
    button => {

      button
        .addEventListener(
          "click",
          () => {

            switchTab(
              button.dataset.tab
            );

          }
        );

    }
  );


/* =========================
   検索
========================= */

function normalizeSearchText(
  text
){

  return String(
    text || ""
  )
  .toLowerCase()
  .trim();

}


function matchesSearch(
  wordData,
  query
){

  if(!query){
    return true;
  }


  const searchableText =
    [
      wordData.word,
      wordData.meaning,
      wordData.example,
      wordData.translation,
      wordData.usage,
      wordData.memo
    ]
    .join(" ")
    .toLowerCase();


  return searchableText
    .includes(
      query
    );

}


$("searchInput")
  .addEventListener(
    "input",
    renderWords
  );


$("filterMode")
  .addEventListener(
    "change",
    renderWords
  );


/* =========================
   苦手スコア
========================= */

function weakScore(word){

  return (
    Number(
      word.wrongCount
      ||
      0
    )
    *
    3
    -
    Number(
      word.correctCount
      ||
      0
    )
  );

}


/* =========================
   単語一覧
========================= */

function renderWords(){

  let list =
    [...words];


  const mode =
    $("filterMode").value;


  const query =
    normalizeSearchText(
      $("searchInput").value
    );


  if(
    mode
    ===
    "wrong"
  ){

    list =
      list.filter(
        word =>
          Number(
            word.wrongCount
            ||
            0
          )
          >
          0
      );

  }

  else if(
    mode
    ===
    "weak"
  ){

    list.sort(
      (a,b) =>
        weakScore(b)
        -
        weakScore(a)
    );

  }

  else{

    list.reverse();

  }


  if(query){

    list =
      list.filter(
        word =>
          matchesSearch(
            word,
            query
          )
      );

  }


  $("wordCount")
    .textContent =
    words.length;


  $("searchResult")
    .textContent =
    query
    ?
    `${list.length}件見つかりました`
    :
    "";


  const container =
    $("wordList");


  container.innerHTML =
    "";


  if(
    !list.length
  ){

    container.appendChild(
      makeText(
        "div",
        query
        ?
        "検索結果がありません。"
        :
        "まだ単語がありません。",
        "empty"
      )
    );

    return;

  }


  list.forEach(
    wordData => {


      const card =
        document.createElement(
          "div"
        );

      card.className =
        "card";


      const top =
        document.createElement(
          "div"
        );

      top.className =
        "space";


      const left =
        document.createElement(
          "div"
        );


      left.appendChild(
        makeText(
          "div",
          wordData.word,
          "word"
        )
      );


      left.appendChild(
        makeText(
          "div",
          wordData.meaning,
          "meaning"
        )
      );


      const speakButton =
        makeText(
          "button",
          "🔊"
        );


      speakButton
        .addEventListener(
          "click",
          () =>
            speak(
              wordData.word
            )
        );


      top.append(
        left,
        speakButton

/* =========================
   写真圧縮
========================= */

async function fileToCompressedBase64(
  file
){

  const image =
    await new Promise(
      (
        resolve,
        reject
      ) => {


        const objectUrl =
          URL.createObjectURL(
            file
          );


        const img =
          new Image();


        img.onload =
          () => {

            URL.revokeObjectURL(
              objectUrl
            );

            resolve(
              img
            );

          };


        img.onerror =
          () => {

            URL.revokeObjectURL(
              objectUrl
            );

            reject(
              new Error(
                "画像を読み込めませんでした"
              )
            );

          };


        img.src =
          objectUrl;

      }
    );


  const maxSize =
    1600;


  const scale =
    Math.min(
      1,
      maxSize
      /
      Math.max(
        image.width,
        image.height
      )
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    Math.round(
      image.width
      *
      scale
    );


  canvas.height =
    Math.round(
      image.height
      *
      scale
    );


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.drawImage(
    image,
    0,
    0,
    canvas.width,
    canvas.height
  );


  const dataUrl =
    canvas.toDataURL(
      "image/jpeg",
      0.84
    );


  return {

    image:
      dataUrl.split(",")[1],

    mimeType:
      "image/jpeg"

  };

}


/* =========================
   AI解析
========================= */

$("analyzeImage")
  .addEventListener(
    "click",
    async () => {


      const file =
        $("aiImage")
          .files?.[0];


      if(!file){

        alert(
          "先に写真を選んでください。"
        );

        return;

      }


      const button =
        $("analyzeImage");


      button.disabled =
        true;


      setAiStatus(
        "AI解析中…\n写真の単語と例文を読み取っています。"
      );


      try{


        const payload =
          await fileToCompressedBase64(
            file
          );


        const response =
          await fetch(
            AI_ENDPOINT,
            {

              method:
                "POST",

              headers:{
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(
                  payload
                )

            }
          );


        const responseText =
          await response.text();


        let data;


        try{

          data =
            JSON.parse(
              responseText
            );

        }

        catch(error){

          throw new Error(
            "AIから正しいデータを取得できませんでした。"
          );

        }


        if(
          !response.ok
          ||
          data.error
        ){

          let details =
            "";


          if(
            data.details
          ){

            details =
              typeof data.details
              ===
              "string"
              ?
              data.details
              :
              JSON.stringify(
                data.details
              );

          }


          throw new Error(
            (
              data.error
              ||
              `HTTP ${response.status}`
            )
            +
            (
              details
              ?
              "\n"
              +
              details
              :
              ""
            )
          );

        }


        if(
          !Array.isArray(
            data.words
          )
          ||
          !data.words.length
        ){

          throw new Error(
            "写真から登録できる単語を見つけられませんでした。"
          );

        }


        aiCandidates =
          data.words
          .map(
            (
              item,
              index
            ) => ({

              _id:
                "ai_"
                +
                index,

              word:
                String(
                  item.word
                  ||
                  ""
                )
                .trim(),

              example:
                String(
                  item.example
                  ||
                  ""
                )
                .trim(),

              meaning:
                String(
                  item.meaning
                  ||
                  ""
                )
                .trim(),

              translation:
                String(
                  item.translation
                  ||
                  ""
                )
                .trim(),

              partOfSpeech:
                String(
                  item.partOfSpeech
                  ||
                  ""
                )
                .trim(),

              memo:
                String(
                  item.memo
                  ||
                  ""
                )
                .trim()

            })
          )
          .filter(
            item =>
              item.word
              &&
              item.meaning
          );


        if(
          !aiCandidates.length
        ){

          throw new Error(
            "登録できる単語データを作れませんでした。"
          );

        }


        renderAiResults();


        setAiStatus(
          `${aiCandidates.length}個の単語を見つけました。\n内容を確認して追加してください。`,
          "ok"
        );

      }

      catch(error){

        console.error(
          error
        );


        setAiStatus(
          "解析に失敗しました。\n"
          +
          String(
            error.message
            ||
            error
          ),
          "err"
        );

      }

      finally{

        button.disabled =
          false;

      }

    }
  );

function shuffle(array){

  const result =
    [...array];


  for(
    let i =
      result.length - 1;

    i > 0;

    i--
  ){

    const j =
      Math.floor(
        Math.random()
        *
        (
          i + 1
        )
      );


    [
      result[i],
      result[j]
    ]
    =
    [
      result[j],
      result[i]
    ];

  }


  return result;

}


function weightedWeakPool(
  pool
){

  return [...pool]
    .sort(
      (a,b) =>
        weakScore(b)
        -
        weakScore(a)
        +
        (
          Math.random()
          -
          0.5
        )
        *
        2
    );

}


function choiceText(
  wordData,
  mode
){

  if(
    mode
    ===
    "ja-en"
  ){

    return wordData.word;

  }


  return wordData.meaning;

}


function makeChoices(
  current,
  mode
){

  const others =
    shuffle(
      words.filter(
        wordData =>
          wordData.id
          !==
          current.id
      )
    )
    .slice(
      0,
      2
    );


  return shuffle(
    [
      current,
      ...others
    ]
  )
  .map(
    wordData => ({

      id:
        wordData.id,

      text:
        choiceText(
          wordData,
          mode
        )

    })
  );

}


$("startQuiz")
  .addEventListener(
    "click",
    () => {


      if(
        words.length
        <
        3
      ){

        alert(
          "3択テストには最低3単語必要です。"
        );

        return;

      }


      let pool =
        [...words];


      const scope =
        $("quizScope").value;


      if(
        scope
        ===
        "wrong"
      ){

        pool =
          pool.filter(
            wordData =>
              Number(
                wordData.wrongCount
                ||
                0
              )
              >
              0
          );

      }

      else if(
        scope
        ===
        "weak"
      ){

        pool =
          weightedWeakPool(
            pool
          );

      }

      else{

        pool =
          shuffle(
            pool
          );

      }


      if(
        !pool.length
      ){

        alert(
          "出題できる単語がありません。"
        );

        return;

      }


      quizItems =
        pool;


      quizIndex =
        0;


      quizCorrect =
        0;


      $("quizResult")
        .classList
        .add(
          "hidden"
        );


      $("quizCard")
        .classList
        .remove(
          "hidden"
        );


      showQuestion();

    }
  );


function showQuestion(){

  if(
    quizIndex
    >=
    quizItems.length
  ){

    showQuizResult();

    return;

  }


  quizAnswered =
    false;


  const current =
    quizItems[
      quizIndex
    ];


  const mode =
    $("quizMode").value;


  $("quizProgress")
    .textContent =
    `${quizIndex + 1} / ${quizItems.length}`;


  $("choices")
    .innerHTML =
    "";


  $("feedback")
    .innerHTML =
    "";


  $("feedback")
    .className =
    "hidden";


  $("nextQuestion")
    .classList
    .add(
      "hidden"
    );


  if(
    mode
    ===
    "en-ja"
  ){

    $("quizPrompt")
      .textContent =
      current.word;


    $("audioArea")
      .classList
      .add(
        "hidden"
      );

  }

  else if(
    mode
    ===
    "ja-en"
  ){

    $("quizPrompt")
      .textContent =
      current.meaning;


    $("audioArea")
      .classList
      .add(
        "hidden"
      );

  }

  else{

    $("quizPrompt")
      .textContent =
      "🔊 音声を聞いて答える";


    $("audioArea")
      .classList
      .remove(
        "hidden"
      );


    setTimeout(
      () => {

        speak(
          current.word
        );

      },
      250
    );

  }


  const choices =
    makeChoices(
      current,
      mode
    );


  choices.forEach(
    choice => {


      const button =
        makeText(
          "button",
          choice.text,
          "choice"
        );


      button.dataset.id =
        choice.id;


      button
        .addEventListener(
          "click",
          () => {

            answerQuestion(
              button,
              choice.id,
              current
            );

          }
        );


      $("choices")
        .appendChild(
          button
        );

    }
  );

}

function answerQuestion(
  button,
  id,
  current
){

  if(
    quizAnswered
  ){
    return;
  }


  quizAnswered =
    true;


  const correct =
    id
    ===
    current.id;


  if(correct){

    quizCorrect++;


    current.correctCount =
      Number(
        current.correctCount
        ||
        0
      )
      +
      1;


    button
      .classList
      .add(
        "selectedCorrect"
      );

  }

  else{

    current.wrongCount =
      Number(
        current.wrongCount
        ||
        0
      )
      +
      1;


    button
      .classList
      .add(
        "selectedWrong"
      );

  }


  [
    ...$("choices").children
  ]
  .forEach(
    choiceButton => {


      choiceButton.disabled =
        true;


      if(
        choiceButton.dataset.id
        ===
        current.id
      ){

        choiceButton
          .classList
          .add(
            "showCorrect"
          );

      }

    }
  );


  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(
      words
    )
  );


  showFeedback(
    current,
    correct
  );


  $("nextQuestion")
    .classList
    .remove(
      "hidden"
    );

}


function showFeedback(
  wordData,
  correct
){

  const box =
    $("feedback");


  box.className =
    "feedback "
    +
    (
      correct
      ?
      "good"
      :
      "bad"
    );


  box.innerHTML =
    "";


  box.appendChild(
    makeText(
      "div",
      correct
      ?
      "✓ 正解"
      :
      "✕ 不正解",
      "feedbackTitle"
    )
  );


  box.appendChild(
    makeText(
      "div",
      wordData.word,
      "word"
    )
  );


  box.appendChild(
    makeText(
      "div",
      wordData.meaning,
      "meaning"
    )
  );


  const audioButtons =
    document.createElement(
      "div"
    );


  audioButtons.className =
    "audio-buttons";


  const wordAudio =
    makeText(
      "button",
      "🔊 単語を再生"
    );


  wordAudio
    .addEventListener(
      "click",
      () =>
        speak(
          wordData.word
        )
    );


  audioButtons.appendChild(
    wordAudio
  );


  if(
    wordData.example
  ){

    const exampleAudio =
      makeText(
        "button",
        "🔊 例文を再生"
      );


    exampleAudio
      .addEventListener(
        "click",
        () =>
          speak(
            wordData.example
          )
      );


    audioButtons.appendChild(
      exampleAudio
    );

  }


  box.appendChild(
    audioButtons
  );


  appendLabeled(
    box,
    "例文",
    wordData.example
  );


  appendLabeled(
    box,
    "例文の日本語訳",
    wordData.translation
  );


  appendLabeled(
    box,
    "使い方メモ",
    wordData.usage
  );


  appendLabeled(
    box,
    "自由メモ",
    wordData.memo
  );


  box
    .classList
    .remove(
      "hidden"
    );

}


$("nextQuestion")
  .addEventListener(
    "click",
    () => {

      quizIndex++;

      showQuestion();


      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    }
  );


function showQuizResult(){

  $("quizCard")
    .classList
    .add(
      "hidden"
    );


  const result =
    $("quizResult");


  result.innerHTML =
    "";


  result
    .classList
    .remove(
      "hidden"
    );


  result.appendChild(
    makeText(
      "div",
      "テスト結果",
      "section-title"
    )
  );


  result.appendChild(
    makeText(
      "div",
      `${quizCorrect} / ${quizItems.length}`,
      "quizPrompt"
    )
  );


  const rate =
    Math.round(
      quizCorrect
      /
      quizItems.length
      *
      100
    );


  result.appendChild(
    makeText(
      "div",
      `正答率 ${rate}%`,
      "muted"
    )
  );


  renderWords();

}


/* =========================
   バックアップ書き出し
========================= */

$("exportBtn")
  .addEventListener(
    "click",
    () => {


      const payload = {

        app:
          "My English Words",

        version:
          6,

        exportedAt:
          new Date()
            .toISOString(),

        words:
          words

      };


      const blob =
        new Blob(
          [
            JSON.stringify(
              payload,
              null,
              2
            )
          ],
          {
            type:
              "application/json"
          }
        );


      const url =
        URL.createObjectURL(
          blob
        );


      const anchor =
        document.createElement(
          "a"
        );


      anchor.href =
        url;


      anchor.download =
        "my-english-words-"
        +
        new Date()
          .toISOString()
          .slice(
            0,
            10
          )
        +
        ".json";


      document.body
        .appendChild(
          anchor
        );


      anchor.click();


      anchor.remove();


      setTimeout(
        () =>
          URL.revokeObjectURL(
            url
          ),
        1000
      );

    }
  );


/* =========================
   バックアップ読み込み
========================= */

$("importBtn")
  .addEventListener(
    "click",
    async () => {


      const file =
        $("importFile")
          .files?.[0];


      if(!file){

        alert(
          "バックアップJSONを選んでください。"
        );

        return;

      }


      try{


        const text =
          await file.text();


        const data =
          JSON.parse(
            text
          );


        const incoming =
          Array.isArray(
            data
          )
          ?
          data
          :
          data.words;


        if(
          !Array.isArray(
            incoming
          )
        ){

          throw new Error(
            "words配列がありません"
          );

        }


        const replace =
          confirm(
            "OK：現在の単語を置き換える\n\nキャンセル：現在の単語に追加する"
          );


        if(replace){

          words =
            incoming;

        }

        else{


          const existing =
            new Set(
              words.map(
                wordData =>
                  String(
                    wordData.word
                    ||
                    ""
                  )
                  .toLowerCase()
              )
            );


          incoming.forEach(
            wordData => {


              const key =
                String(
                  wordData.word
                  ||
                  ""
                )
                .toLowerCase();


              if(
                !existing.has(
                  key
                )
              ){

                words.push(
                  wordData
                );


                existing.add(
                  key
                );

              }

            }
          );

        }


        saveWords();


        alert(
          "バックアップを復元しました。"
        );


        switchTab(
          "words"
        );

      }

      catch(error){

        alert(
          "読み込みに失敗しました。\n"
          +
          String(
            error.message
            ||
            error
          )
        );

      }

    }
  );


/* 最初の表示 */

renderWords();


})();

</script>
