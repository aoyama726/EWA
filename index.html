<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#111827"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<title>My English Words</title>

<style>

:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --primary:#111827;
  --blue:#2563eb;
  --red:#dc2626;
  --green:#15803d;
  --purple:#3730a3;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:var(--bg);

  color:var(--text);
}

header{
  position:sticky;

  top:0;

  z-index:10;

  background:
    rgba(245,247,251,.96);

  backdrop-filter:
    blur(12px);

  border-bottom:
    1px solid var(--line);

  padding:
    18px 16px;
}

header h1{
  margin:0;

  font-size:22px;
}

main{
  max-width:760px;

  margin:auto;

  padding:
    16px 16px 100px;
}

.tabs{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;

  margin-bottom:18px;
}

button{
  border:0;

  border-radius:14px;

  padding:
    13px 14px;

  font-size:16px;

  font-weight:750;

  background:#e5e7eb;

  color:#111827;
}

.tab{
  min-height:60px;

  font-size:18px;
}

.tab.active,
button.primary{
  background:
    var(--primary);

  color:white;
}

button.blue{
  background:
    var(--blue);

  color:white;
}

button.danger{
  background:#fee2e2;

  color:var(--red);
}

button.correct{
  background:#dcfce7;

  color:var(--green);
}

.card{
  background:
    var(--card);

  border:
    1px solid var(--line);

  border-radius:20px;

  padding:18px;

  margin-bottom:14px;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.03);
}

.section-title{
  font-size:22px;

  font-weight:850;

  margin-bottom:6px;
}

label{
  display:block;

  font-weight:800;

  font-size:15px;

  margin:
    18px 0 8px;
}

input,
textarea,
select{
  width:100%;

  padding:
    13px 14px;

  border:
    1px solid #d1d5db;

  border-radius:13px;

  background:white;

  color:#111827;

  font-size:17px;

  font-family:inherit;
}

textarea{
  min-height:100px;

  resize:vertical;
}

.row{
  display:flex;

  gap:10px;

  align-items:center;

  flex-wrap:wrap;
}

.space{
  display:flex;

  justify-content:
    space-between;

  gap:12px;

  align-items:flex-start;
}

.grid2{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;
}

.word{
  font-size:29px;

  font-weight:850;

  word-break:
    break-word;
}

.meaning{
  font-size:18px;

  margin-top:6px;

  white-space:
    pre-wrap;
}

.small{
  font-size:16px;

  line-height:1.6;

  white-space:
    pre-wrap;
}

.muted{
  color:
    var(--muted);

  font-size:14px;

  line-height:1.5;
}

.pill{
  display:inline-block;

  background:#eef2ff;

  color:var(--purple);

  padding:
    5px 9px;

  border-radius:999px;

  font-size:13px;

  font-weight:800;
}

.hidden{
  display:none !important;
}

.stats{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;

  margin-top:16px;
}

.stat{
  background:#f9fafb;

  border-radius:14px;

  padding:
    14px 8px;

  text-align:center;
}

.stat strong{
  display:block;

  font-size:21px;
}

.empty{
  text-align:center;

  color:
    var(--muted);

  padding:
    40px 12px;

  font-size:17px;
}

.quizPrompt{
  font-size:32px;

  font-weight:850;

  text-align:center;

  margin:
    26px 0;

  white-space:
    pre-wrap;

  word-break:
    break-word;
}

.choices{
  display:grid;

  gap:12px;

  margin-top:18px;
}

.choice{
  width:100%;

  min-height:64px;

  background:#f3f4f6;

  border:
    2px solid transparent;

  text-align:left;

  padding:16px;

  font-size:18px;
}

.choice.selectedCorrect{
  background:#dcfce7;

  border-color:#22c55e;

  color:#166534;
}

.choice.selectedWrong{
  background:#fee2e2;

  border-color:#ef4444;

  color:#991b1b;
}

.choice.showCorrect{
  background:#dcfce7;

  border-color:#22c55e;
}

.feedback{
  margin-top:18px;

  padding:16px;

  border-radius:16px;
}

.feedback.good{
  background:#ecfdf5;
}

.feedback.bad{
  background:#fef2f2;
}

.feedbackTitle{
  font-size:22px;

  font-weight:850;
}

.divider{
  height:1px;

  background:
    var(--line);

  margin:
    16px 0;
}

.audio-buttons{
  display:flex;

  gap:10px;

  flex-wrap:wrap;

  margin-top:12px;
}

#nextQuestion{
  width:100%;

  margin-top:16px;
}

@media(max-width:560px){

  .grid2{
    grid-template-columns:
      1fr;
  }

}

</style>
</head>

<body>

<header>
  <h1>
    My English Words
  </h1>
</header>

<main>

<div class="tabs">

  <button
    class="tab active"
    data-tab="words"
  >
    単語帳
  </button>

  <button
    class="tab"
    data-tab="add"
  >
    追加
  </button>

  <button
    class="tab"
    data-tab="quiz"
  >
    テスト
  </button>

  <button
    class="tab"
    data-tab="backup"
  >
    バックアップ
  </button>

</div>


<!-- ====================
     単語帳
==================== -->

<section id="wordsSection">

  <div class="card">

    <div class="space">

      <div>

        <div class="section-title">
          登録単語
        </div>

        <div class="muted">
          <span id="wordCount">
            0
          </span>
          words
        </div>

      </div>

      <select
        id="filterMode"
        style="width:auto"
      >

        <option value="all">
          すべて
        </option>

        <option value="wrong">
          間違えた単語
        </option>

        <option value="weak">
          苦手順
        </option>

      </select>

    </div>

  </div>

  <div id="wordList"></div>

</section>


<!-- ====================
     追加
==================== -->

<section
  id="addSection"
  class="hidden"
>

  <div class="card">

    <div
      class="section-title"
      id="formTitle"
    >
      単語を追加
    </div>

    <div class="muted">
      単語と意味だけ必須です。
    </div>

    <input
      type="hidden"
      id="editId"
    >


    <label>
      英単語・フレーズ
    </label>

    <input
      id="word"
      autocapitalize="none"
      autocomplete="off"
      placeholder="例: impact"
    >


    <label>
      例文
    </label>

    <textarea
      id="example"
      placeholder="The new policy had a big impact on the company."
    ></textarea>


    <label>
      意味
    </label>

    <textarea
      id="meaning"
      placeholder="例: 影響、衝撃 / 影響を与える"
    ></textarea>


    <label>
      例文の日本語訳
    </label>

    <textarea
      id="translation"
      placeholder="その新しい方針は会社に大きな影響を与えた。"
    ></textarea>


    <label>
      使い方メモ
    </label>

    <textarea
      id="usage"
      placeholder="例: impact on ～ で「～への影響」"
    ></textarea>


    <label>
      自由メモ
    </label>

    <textarea
      id="memo"
      placeholder="自分の覚え方やニュアンス"
    ></textarea>


    <div
      class="row"
      style="margin-top:18px"
    >

      <button
        class="primary"
        id="saveBtn"
      >
        保存
      </button>

      <button
        id="cancelEdit"
        class="hidden"
      >
        キャンセル
      </button>

    </div>

  </div>

</section>


<!-- ====================
     テスト
==================== -->

<section
  id="quizSection"
  class="hidden"
>

  <div class="card">

    <div class="section-title">
      テスト
    </div>

    <div class="grid2">

      <div>

        <label>
          テスト形式
        </label>

        <select id="quizMode">

          <option value="en-ja">
            英語 → 日本語
          </option>

          <option value="ja-en">
            日本語 → 英語
          </option>

          <option value="audio">
            音声 → 日本語
          </option>

        </select>

      </div>


      <div>

        <label>
          出題範囲
        </label>

        <select id="quizScope">

          <option value="all">
            すべて
          </option>

          <option value="wrong">
            間違えた単語のみ
          </option>

          <option value="weak">
            苦手優先
          </option>

        </select>

      </div>

    </div>


    <button
      class="primary"
      id="startQuiz"
      style="
        width:100%;
        margin-top:18px;
      "
    >
      テスト開始
    </button>

  </div>


  <div
    id="quizCard"
    class="card hidden"
  >

    <div
      class="muted"
      id="quizProgress"
    ></div>


    <div
      id="quizPrompt"
      class="quizPrompt"
    ></div>


    <div
      id="audioArea"
      class="row hidden"
      style="justify-content:center"
    >

      <button
        class="blue"
        id="playAudio"
      >
        ▶ 再生
      </button>

    </div>


    <div
      id="choices"
      class="choices"
    ></div>


    <div
      id="feedback"
      class="hidden"
    ></div>


    <button
      class="primary hidden"
      id="nextQuestion"
    >
      次の問題 →
    </button>

  </div>


  <div
    id="quizResult"
    class="card hidden"
  ></div>

</section>


<!-- ====================
     バックアップ
==================== -->

<section
  id="backupSection"
  class="hidden"
>

  <div class="card">

    <div class="section-title">
      バックアップ
    </div>

    <div class="muted">
      Safariのデータ削除や
      機種変更に備えて保存できます。
    </div>


    <label>
      バックアップを書き出す
    </label>

    <button
      class="primary"
      id="exportBtn"
      style="width:100%"
    >
      JSONファイルを保存
    </button>


    <div class="divider"></div>


    <label>
      バックアップを読み込む
    </label>

    <input
      type="file"
      id="importFile"
      accept=".json,application/json"
    >


    <button
      id="importBtn"
      style="
        width:100%;
        margin-top:12px;
      "
    >
      選んだバックアップを復元
    </button>

  </div>

</section>

</main>


<script>

(() => {

"use strict";


/* =========================
   保存
========================= */

const STORAGE_KEY =
  "myEnglishWords_v2";


const LEGACY_KEYS = [
  "myEnglishWords",
  "myEnglishWords_v1"
];


const $ =
  id =>
  document.getElementById(id);


let words =
  loadWords();


let quizItems = [];

let quizIndex = 0;

let quizCorrect = 0;

let quizAnswered = false;



function loadWords(){

  try{

    const current =
      localStorage
        .getItem(
          STORAGE_KEY
        );


    if(current){

      const parsed =
        JSON.parse(
          current
        );


      if(
        Array.isArray(
          parsed
        )
      ){

        return parsed;

      }

    }


    for(
      const key
      of
      LEGACY_KEYS
    ){

      const old =
        localStorage
          .getItem(
            key
          );


      if(!old){
        continue;
      }


      const parsed =
        JSON.parse(
          old
        );


      if(
        Array.isArray(
          parsed
        )
      ){

        localStorage
          .setItem(
            STORAGE_KEY,
            JSON.stringify(
              parsed
            )
          );


        return parsed;

      }

    }

  }

  catch(error){

    console.error(
      error
    );

  }


  return [];

}



function saveWords(){

  localStorage
    .setItem(
      STORAGE_KEY,
      JSON.stringify(
        words
      )
    );


  renderWords();

}



function uid(){

  return (
    Date.now()
      .toString(36)
    +
    "_"
    +
    Math.random()
      .toString(36)
      .slice(2,8)
  );

}



/* =========================
   音声
========================= */

function speak(text){

  if(!text){
    return;
  }


  if(
    !(
      "speechSynthesis"
      in
      window
    )
  ){

    alert(
      "音声読み上げを利用できません。"
    );

    return;

  }


  speechSynthesis
    .cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang =
    "en-US";


  utterance.rate =
    0.85;


  const voices =
    speechSynthesis
      .getVoices();


  const englishVoice =
    voices.find(
      voice =>
        voice.lang
        ===
        "en-US"
    )
    ||
    voices.find(
      voice =>
        voice.lang
        &&
        voice.lang
          .startsWith(
            "en"
          )
    );


  if(englishVoice){

    utterance.voice =
      englishVoice;

  }


  speechSynthesis
    .speak(
      utterance
    );

}



/* =========================
   共通
========================= */

function makeText(
  tag,
  text,
  className = ""
){

  const element =
    document
      .createElement(
        tag
      );


  if(className){

    element.className =
      className;

  }


  element.textContent =
    text || "";


  return element;

}



function switchTab(name){

  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      button => {

        button
          .classList
          .toggle(
            "active",
            button.dataset.tab
            ===
            name
          );

      }
    );


  $("wordsSection")
    .classList
    .toggle(
      "hidden",
      name !== "words"
    );


  $("addSection")
    .classList
    .toggle(
      "hidden",
      name !== "add"
    );


  $("quizSection")
    .classList
    .toggle(
      "hidden",
      name !== "quiz"
    );


  $("backupSection")
    .classList
    .toggle(
      "hidden",
      name !== "backup"
    );


  if(
    name
    ===
    "words"
  ){

    renderWords();

  }

}



document
  .querySelectorAll(
    ".tab"
  )
  .forEach(
    button => {

      button
        .addEventListener(
          "click",
          () => {

            switchTab(
              button.dataset.tab
            );

          }
        );

    }
  );



/* =========================
   単語帳
========================= */

function weakScore(word){

  return (
    Number(
      word.wrongCount
      ||
      0
    )
    *
    3
    -
    Number(
      word.correctCount
      ||
      0
    )
  );

}



function renderWords(){

  let list =
    [...words];


  const mode =
    $("filterMode")
      .value;


  if(
    mode
    ===
    "wrong"
  ){

    list =
      list.filter(
        word =>
          Number(
            word.wrongCount
            ||
            0
          )
          >
          0
      );

  }


  else if(
    mode
    ===
    "weak"
  ){

    list.sort(
      (a,b) =>
        weakScore(b)
        -
        weakScore(a)
    );

  }


  else{

    list.reverse();

  }


  $("wordCount")
    .textContent =
    words.length;


  const container =
    $("wordList");


  container.innerHTML =
    "";


  if(
    !list.length
  ){

    container
      .appendChild(
        makeText(
          "div",
          "まだ単語がありません。",
          "empty"
        )
      );


    return;

  }



  list.forEach(
    wordData => {

      const card =
        document
          .createElement(
            "div"
          );


      card.className =
        "card";



      const top =
        document
          .createElement(
            "div"
          );


      top.className =
        "space";



      const left =
        document
          .createElement(
            "div"
          );


      left.appendChild(
        makeText(
          "div",
          wordData.word,
          "word"
        )
      );


      left.appendChild(
        makeText(
          "div",
          wordData.meaning,
          "meaning"
        )
      );



      const speaker =
        makeText(
          "button",
          "🔊"
        );


      speaker
        .addEventListener(
          "click",
          () =>
            speak(
              wordData.word
            )
        );


      top.append(
        left,
        speaker
      );


      card.appendChild(
        top
      );



      if(
        wordData.example
      ){

        const exampleBox =
          document
            .createElement(
              "div"
            );


        exampleBox
          .style
          .marginTop =
          "18px";


        exampleBox
          .appendChild(
            makeText(
              "b",
              "例文"
            )
          );


        const example =
          makeText(
            "div",
            wordData.example,
            "small"
          );


        example
          .style
          .marginTop =
          "6px";


        exampleBox
          .appendChild(
            example
          );


        const exampleSpeaker =
          makeText(
            "button",
            "🔊 例文を再生"
          );


        exampleSpeaker
          .style
          .marginTop =
          "10px";


        exampleSpeaker
          .addEventListener(
            "click",
            () =>
              speak(
                wordData.example
              )
          );


        exampleBox
          .appendChild(
            exampleSpeaker
          );


        card.appendChild(
          exampleBox
        );

      }



      if(
        wordData.translation
      ){

        const translation =
          makeText(
            "div",
            wordData.translation,
            "muted"
          );


        translation
          .style
          .marginTop =
          "8px";


        card.appendChild(
          translation
        );

      }



      if(
        wordData.usage
      ){

        const usageBox =
          document
            .createElement(
              "div"
            );


        usageBox
          .style
          .marginTop =
          "16px";


        usageBox
          .appendChild(
            makeText(
              "span",
              "使い方",
              "pill"
            )
          );


        const usage =
          makeText(
            "div",
            wordData.usage,
            "small"
          );


        usage.style.marginTop =
          "8px";


        usageBox
          .appendChild(
            usage
          );


        card.appendChild(
          usageBox
        );

      }



      if(
        wordData.memo
      ){

        const memoBox =
          document
            .createElement(
              "div"
            );


        memoBox
          .style
          .marginTop =
          "14px";


        memoBox
          .appendChild(
            makeText(
              "span",
              "メモ",
              "pill"
            )
          );


        const memo =
          makeText(
            "div",
            wordData.memo,
            "small"
          );


        memo
          .style
          .marginTop =
          "8px";


        memoBox
          .appendChild(
            memo
          );


        card.appendChild(
          memoBox
        );

      }



      const correct =
        Number(
          wordData.correctCount
          ||
          0
        );


      const wrong =
        Number(
          wordData.wrongCount
          ||
          0
        );


      const stats =
        document
          .createElement(
            "div"
          );


      stats.className =
        "stats";


      [
        [
          "正解",
          correct
        ],
        [
          "間違い",
          wrong
        ],
        [
          "回答",
          correct + wrong
        ]
      ]
      .forEach(
        ([label,value]) => {

          const stat =
            document
              .createElement(
                "div"
              );


          stat.className =
            "stat";


          stat.appendChild(
            makeText(
              "strong",
              String(value)
            )
          );


          stat.appendChild(
            makeText(
              "span",
              label,
              "muted"
            )
          );


          stats
            .appendChild(
              stat
            );

        }
      );


      card.appendChild(
        stats
      );



      const actions =
        document
          .createElement(
            "div"
          );


      actions.className =
        "row";


      actions.style.marginTop =
        "16px";



      const edit =
        makeText(
          "button",
          "編集"
        );


      edit
        .addEventListener(
          "click",
          () =>
            editWord(
              wordData.id
            )
        );



      const del =
        makeText(
          "button",
          "削除",
          "danger"
        );


      del
        .addEventListener(
          "click",
          () =>
            deleteWord(
              wordData.id
            )
        );



      actions.append(
        edit,
        del
      );


      card.appendChild(
        actions
      );


      container.appendChild(
        card
      );

    }
  );

}



$("filterMode")
  .addEventListener(
    "change",
    renderWords
  );



/* =========================
   追加 / 編集
========================= */

function clearForm(){

  [
    "editId",
    "word",
    "example",
    "meaning",
    "translation",
    "usage",
    "memo"
  ]
  .forEach(
    id => {

      $(id).value =
        "";

    }
  );


  $("formTitle")
    .textContent =
    "単語を追加";

/* =========================
   3択テスト
========================= */

function shuffle(array){

  const result =
    [...array];


  for(
    let i =
      result.length - 1;

    i > 0;

    i--
  ){

    const j =
      Math.floor(
        Math.random()
        *
        (i + 1)
      );


    [
      result[i],
      result[j]
    ]
    =
    [
      result[j],
      result[i]
    ];

  }


  return result;

}



function weightedWeakPool(source){

  const result = [];


  source.forEach(
    word => {

      const wrong =
        Number(
          word.wrongCount
          ||
          0
        );


      const correct =
        Number(
          word.correctCount
          ||
          0
        );


      const weight =
        Math.max(
          1,
          1
          +
          wrong * 2
          -
          Math.floor(
            correct / 3
          )
        );


      for(
        let i = 0;

        i <
        Math.min(
          weight,
          5
        );

        i++
      ){

        result.push(
          word
        );

      }

    }
  );


  return shuffle(
    result
  );

}



/*
 英語→日本語
 → 日本語の意味を選ぶ

 日本語→英語
 → 英単語を選ぶ

 音声→日本語
 → 英語音声を聞いて
   日本語の意味を選ぶ
*/

function getChoiceText(
  wordData,
  mode
){

  if(
    mode
    ===
    "ja-en"
  ){

    return wordData.word;

  }


  return wordData.meaning;

}



function getThreeChoices(
  correctWord,
  mode
){

  const others =
    words.filter(
      word =>
        word.id
        !==
        correctWord.id
    );


  const randomOthers =
    shuffle(
      others
    )
    .slice(
      0,
      2
    );


  const choices =
    [
      correctWord,
      ...randomOthers
    ];


  return shuffle(
    choices
  )
  .map(
    word => ({

      id:word.id,

      text:
        getChoiceText(
          word,
          mode
        )

    })
  );

}



$("startQuiz")
  .addEventListener(
    "click",
    () => {

      if(
        words.length
        <
        3
      ){

        alert(
          "3択テストには最低3単語必要です。"
        );

        return;

      }



      const scope =
        $("quizScope")
          .value;


      let pool =
        [...words];



      if(
        scope
        ===
        "wrong"
      ){

        pool =
          pool.filter(
            word =>
              Number(
                word.wrongCount
                ||
                0
              )
              >
              0
          );

      }


      else if(
        scope
        ===
        "weak"
      ){

        pool =
          weightedWeakPool(
            pool
          );

      }


      else{

        pool =
          shuffle(
            pool
          );

      }



      if(
        !pool.length
      ){

        alert(
          "出題できる単語がありません。"
        );

        return;

      }



      quizItems =
        pool;


      quizIndex =
        0;


      quizCorrect =
        0;



      $("quizResult")
        .classList
        .add(
          "hidden"
        );


      $("quizCard")
        .classList
        .remove(
          "hidden"
        );


      showQuestion();

    }
  );



function showQuestion(){

  if(
    quizIndex
    >=
    quizItems.length
  ){

    showQuizResult();

    return;

  }



  quizAnswered =
    false;



  const current =
    quizItems[
      quizIndex
    ];


  const mode =
    $("quizMode")
      .value;



  $("quizProgress")
    .textContent =
    `${quizIndex + 1} / ${quizItems.length}`;



  $("choices")
    .innerHTML =
    "";


  $("feedback")
    .innerHTML =
    "";


  $("feedback")
    .className =
    "hidden";


  $("nextQuestion")
    .classList
    .add(
      "hidden"
    );



  if(
    mode
    ===
    "en-ja"
  ){

    $("quizPrompt")
      .textContent =
      current.word;


    $("audioArea")
      .classList
      .add(
        "hidden"
      );

  }



  else if(
    mode
    ===
    "ja-en"
  ){

    $("quizPrompt")
      .textContent =
      current.meaning;


    $("audioArea")
      .classList
      .add(
        "hidden"
      );

  }



  else{

    $("quizPrompt")
      .textContent =
      "🔊 音声を聞いて日本語を選ぶ";


    $("audioArea")
      .classList
      .remove(
        "hidden"
      );


    setTimeout(
      () =>
        speak(
          current.word
        ),
      300
    );

  }



  const choices =
    getThreeChoices(
      current,
      mode
    );



  choices.forEach(
    choice => {

      const button =
        makeText(
          "button",
          choice.text,
          "choice"
        );


      button.dataset.id =
        choice.id;


      button
        .addEventListener(
          "click",
          () =>
            answerQuestion(
              choice.id,
              button
            )
        );


      $("choices")
        .appendChild(
          button
        );

    }
  );

}



$("playAudio")
  .addEventListener(
    "click",
    () => {

      if(
        quizIndex
        <
        quizItems.length
      ){

        speak(

            quizIndex

        );

    }
  );



function answerQuestion(
  selectedId,
  selectedButton
){

  if(
    quizAnswered
  ){
    return;
  }


  quizAnswered =
    true;



  const current =
    quizItems[
      quizIndex
    ];



  const isCorrect =
    selectedId
    ===
    current.id;



  document
    .querySelectorAll(
      ".choice"
    )
    .forEach(
      button => {

        button.disabled =
          true;


        if(
          button.dataset.id
          ===
          current.id
        ){

          button
            .classList
            .add(
              "showCorrect"
            );

        }

      }
    );



  if(
    isCorrect
  ){

    selectedButton
      .classList
      .add(
        "selectedCorrect"
      );


    current.correctCount =
      Number(
        current.correctCount
        ||
        0
      )
      +
      1;


    quizCorrect++;

  }


  else{

    selectedButton
      .classList
      .add(
        "selectedWrong"
      );


    current.wrongCount =
      Number(
        current.wrongCount
        ||
        0
      )
      +
      1;

  }



  current.updatedAt =
    Date.now();



  localStorage
    .setItem(
      STORAGE_KEY,
      JSON.stringify(
        words
      )
    );



  showFeedback(
    current,
    isCorrect
  );



  $("nextQuestion")
    .classList
    .remove(
      "hidden"
    );

}

  /* 例文日本語 */

$("exportBtn")
  .addEventListener(
    "click",
    () => {

      const payload = {

        app:
          "My English Words",

        version:4,

        exportedAt:
          new Date()
            .toISOString(),

        words

      };



      const blob =
        new Blob(
          [
            JSON.stringify(
              payload,
              null,
              2
            )
          ],
          {
            type:
              "application/json"
          }
        );



      const url =
        URL.createObjectURL(
          blob
        );



      const link =
        document
          .createElement(
            "a"
          );



      const date =
        new Date()
          .toISOString()
          .slice(
            0,
            10
          );



      link.href =
        url;



      link.download =
        `english-words-backup-${date}.json`;



      document.body
        .appendChild(
          link
        );



      link.click();


      link.remove();



      setTimeout(
        () =>
          URL
            .revokeObjectURL(
              url
            ),
        1000
      );

    }
  );



$("importBtn")
  .addEventListener(
    "click",
    async () => {

      const file =
        $("importFile")
          .files?.[0];



      if(!file){

        alert(
          "バックアップファイルを選んでください。"
        );

        return;

      }



      try{

        const text =
          await file.text();



        const parsed =
          JSON.parse(
            text
          );



        const incoming =
          Array.isArray(
            parsed
          )
          ?
          parsed
          :
          parsed.words;



        if(
          !Array.isArray(
            incoming
          )
        ){

          throw new Error();

        }



        const add =
          confirm(
            "OK = 現在の単語帳に追加\n\nキャンセル = 現在の単語帳をバックアップ内容で置き換え"
          );



        if(add){

          const existingIds =
            new Set(
              words.map(
                word =>
                  word.id
              )
            );



          const normalized =
            incoming.map(
              word => ({

                ...word,

                id:
                  word.id
                  &&
                  !existingIds
                    .has(
                      word.id
                    )
                  ?
                  word.id
                  :
                  uid()

              })
            );



          words = [
            ...words,
            ...normalized
          ];

        }



        else{

          const sure =
            confirm(
              "現在の単語帳を置き換えます。よろしいですか？"
            );



          if(!sure){
            return;
          }



          words =
            incoming.map(
              word => ({

                ...word,

                id:
                  word.id
                  ||
                  uid()

              })
            );

        }



        saveWords();



        $("importFile").value =
          "";



        alert(
          "バックアップを読み込みました。"
        );



        switchTab(
          "words"
        );

      }



      catch(error){

        console.error(
          error
        );


        alert(
          "正しいバックアップJSONではありません。"
        );

      }

    }
  );



renderWords();

})();
