<section id="addSection" class="hidden">

  <div class="card">

    <div class="section-title" id="formTitle">
      単語を追加
    </div>

    <div class="muted">
      単語と意味だけ必須です。
    </div>

    <input type="hidden" id="editId">

    <label>英単語・フレーズ</label>
    <input
      id="word"
      autocomplete="off"
      placeholder="例: impact"
    >

    <label>例文</label>
    <textarea
      id="example"
      placeholder="The new policy had a big impact on the company."
    ></textarea>

    <label>意味</label>
    <textarea
      id="meaning"
      placeholder="例: 影響、衝撃 / 影響を与える"
    ></textarea>

    <label>例文の日本語訳</label>
    <textarea
      id="translation"
      placeholder="その新しい方針は会社に大きな影響を与えた。"
    ></textarea>

    <label>使い方メモ</label>
    <textarea
      id="usage"
      placeholder="例: impact on ～ で「～への影響」"
    ></textarea>

    <label>自由メモ</label>
    <textarea
      id="memo"
      placeholder="自分の覚え方、ニュアンス、気づきなど"
    ></textarea>

    <div class="row" style="margin-top:14px">

      <button class="primary" id="saveBtn">
        保存
      </button>

      <button id="cancelEdit" class="hidden">
        キャンセル
      </button>

    </div>

  </div>

</section>
